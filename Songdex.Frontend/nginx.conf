# /etc/nginx/conf.d/coversongs.conf

server {
    listen 0.0.0.0:80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keeps the API on the same origin as the app, so the frontend gets by with a
    # relative base URL and no CORS. proxy_pass without a path passes the full URI on.
    location /api/ {
        proxy_pass http://backend:8080;
    }
}
