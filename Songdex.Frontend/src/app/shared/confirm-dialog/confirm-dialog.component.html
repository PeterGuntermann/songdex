<dialog #dialog class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{ heading() }}</h3>
    <p class="py-4">{{ message() }}</p>
    <form method="dialog" class="modal-action">
      <button type="submit" value="cancel" class="btn">{{ cancelLabel() }}</button>
      <button type="submit" value="confirm" class="btn btn-error">{{ confirmLabel() }}</button>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="submit" value="cancel" aria-label="Close">close</button>
  </form>
</dialog>
